<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Adder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
        <div class="head">
            <i id="icon" class="fa-solid fa-circle-plus"></i>
            <h1>Number Adder</h1>
        </div>
        <div class="discription">
            <p>Enter two numbers below and click the button to add them together.</p>
        </div>
        <section>
            <input type="number"name="inp" id="inp1" required placeholder="Enter Number">
            <i id="icon2" class="fa-solid fa-plus"></i>
            <input type="number"name="inp" id="inp2" required placeholder="Enter Number">
        </section>
        <button id="button">Add numbers</button>
        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
