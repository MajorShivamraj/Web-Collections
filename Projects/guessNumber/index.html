<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Number</title>
    <style>
        *{
            margin: 10px;
        }
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

        }
        #result{
            font-size: 25px;
        }
    </style>
</head>
<body>
    <h1>Guess your Number</h1>
    <p>Enter number from 1 to 10</p>
    <input type="number" id="guessNum" placeholder="Enter Number">
    <button id="checkBtn">Check Number</button>
    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
