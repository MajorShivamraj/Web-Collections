<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />


    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="screen"><div class="num">0</div></div>
        <div class="row0">
            <div class="box_undo"><i class="fa-solid fa-delete-left"></i></div>
        </div>
        <div class="row1">
            <div class="box box7">7</div>
            <div class="box box8">8</div>
            <div class="box box9">9</div>
            <div class="box box_minus">-</div>
        </div>
        <div class="row2">
            <div class="box box4">4</div>
            <div class="box box5">5</div>
            <div class="box box6">6</div>
            <div class="box box_plus">+</div>
        </div>
        <div class="row3">
            <div class="box box1">1</div>
            <div class="box box2">2</div>
            <div class="box box3">3</div>
            <div class="box box_mult">*</div>
        </div>
        <div class="row4">
            <div class="box box0">0</div>
            <div class="box reset">Reset</div>
            <div class="box equal">=</div>
            <div class="box box_divide">/</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
