<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favicns and Icons</title>
    <!-- For png we need to define the types as -->
    <link rel="Icons" href="/newlogo.png" type="image/png" />

    <!-- For svg we need to define the types as -->
    <link rel="Icons" href="/mylogo.png" type="image/svg+xml" />

    <!-- For ico we need to define the types as -->
    <link rel="Icons" href="/mylogo.png" type="image/x-icon" />

    <!-- Now integrating icons in our website -->

    <!-- Font Awesom cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <h1>Fevicons and Icons</h1>
    <img src="mylogo.png" alt="" />

    <!-- get the Icons from fontawesom -->
    <div>
      <i
        style="color: green; font-size: 60px; font-weight: 600"
        class="fa-regular fa-circle-user"
      ></i>
    </div>

    <!-- get the svg from undraw -->
    <img
      style="background-color: lightgreen"
      width="300"
      height="300"
      src="./undraw_football-with-dad_w7m1.svg"
      alt="playing with child"
    />
  </body>
</html>
