<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Bootstrap.</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <h1>registration form</h1>
   <form action="" method="post" class="text-bg-dark m-5 p-4">
    <!-- for label (form-label) -->
    <!-- for input (form-input) -->
        <div>
            <label for="name" class="form-label">Name :</label>
            <input type="text" class="form-control">
        </div>
        <div>
            <label for="Email" class="form-label">Email :</label>
            <input type="email" class="form-control">
        </div>
        <div>
            <label for="Number" class="form-label">Number :</label>
            <input type="text" class="form-control">
        </div>
        <div>
            <label for="upload" class="form-label">Upload File </label>
            <input type="file" name="file" id="upload" class="form-control h-5">
        </div>
        <!-- Checkbox
         for div (form-check) 
         for input(form-check-input)
         for label(form-check-label)
        -->
        <div class="form-check m-3">
            <input type="checkbox" name="" id="check" class="form-check-input">
            <label for="check" class="form-check-label" >will you be available</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="gender1">
            <label class="form-check-label" for="gender1">Male</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="gender2">
            <label class="form-check-label" for="gender2">Female</label>
        </div>


                <!-- For aligning the button to center use text-center -->
                 <!-- btn btn-danger gives color to the button as danger -->
                  <!-- btn btn-outline-danger gives danger colored outline  -->
        <div class="button d-flex justify-content-center"><button class="btn btn-outline-danger">Submit</button></div>

        <!-- Other ways to align the button to center are... -->
         <!-- d-flex justify-content-center -->
          <!-- text-center -->
   </form>

</body>
</html>
