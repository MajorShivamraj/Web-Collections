<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Images..</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

</head>
<body class="bg-dark">
    <h1 class="text-success">Responsive Images in Bootstrap..</h1>
    <img src="Trees.jpg" alt="tree/nature" class="img-fluid w-100">

    <!-- responsive Positioning.. -->
     <img src="Trees.jpg" alt="" class="w-25 float-start m-4">
     <img src="Trees.jpg" alt="" class="w-25 center-block m-4">
     <img src="Trees.jpg" alt="" class="w-25 float-end m-4">

     <img src="Trees.jpg" alt="tree/nature" class="img-thumbnail w-75 mx-5 mb-5">

</body>
</html>
